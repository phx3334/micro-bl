# 前端只托管 SPA 静态资源；/api/v1/* 由 Istio VirtualService 直连后端，
# 不再在这里做 API 反向代理（少一跳，也避免与网格路由重复维护）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 基础安全头；静态资源由 CDN/浏览器缓存，index.html 必须每次回源校验
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm;

    # 构建产物带内容哈希，可以长缓存
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html 不缓存，保证发布后立即生效
    location = /index.html {
        expires -1;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
